name: Bump saw-agent-dev formula

# Dev-lane counterpart to bump-formula.yml. Same receiving-half shape (repository_dispatch +
# workflow_dispatch, reusing script/bump-formula.rb against Formula/saw-agent-dev.rb instead of
# the stable formula) — but unlike stable (one release ever, saw-agent-v0.1.0), the dev channel
# on LenderCom/saw-agent-releases cuts several pre-releases a DAY, and nothing dispatches this
# repo on publish yet (the sending side is the same unwired ticket B1 as stable's dispatch). So
# this also polls on a schedule until that dispatch lands — `workflow_dispatch`/
# `repository_dispatch` both still work for a manual or wired-later bump; drop the schedule once
# saw-agent's dev release workflow dispatches `saw-agent-dev-release` here directly.
#
# Unlike the stable lane this pushes STRAIGHT TO main rather than opening a PR: saw-agent's
# release-dev.yml prunes LenderCom/saw-agent-releases to the newest 5 dev prereleases, so a bump
# parked in an unmerged PR outlives the release it pins and `brew install
# lendercom/tap/saw-agent-dev` starts 404ing on the download. The edit is entirely
# script-generated, so there is nothing for a human to review during that window.
on:
  repository_dispatch:
    types: [saw-agent-dev-release]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag on LenderCom/saw-agent-releases, e.g. dev-v0.2.0-dev.5 (default: latest pre-release)"
        required: false
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: bump-saw-agent-dev
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      # No `token:` — the default GITHUB_TOKEN plus `permissions: contents: write` above is
      # enough to push main. TAP_RELEASE_TOKEN, which this named, has never existed on this
      # repo: the expression resolved to empty and checkout died on "Input required and not
      # supplied: token". That was invisible until the `brew` fix let a run reach checkout.
      #
      # A push by GITHUB_TOKEN deliberately does not trigger other workflows, so an automated
      # bump will not fire tap-canary.yml's `push` trigger — the canary's hourly schedule is
      # what covers a bumped formula.
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.client_payload.tag || inputs.tag }}"
          if [ -z "$tag" ]; then
            # gh release list returns newest-first; the dev channel has no other
            # prerelease kind on this repo, so the first non-draft prerelease is latest-dev.
            tag=$(gh release list --repo LenderCom/saw-agent-releases \
              --json tagName,isPrerelease,isDraft \
              --jq '[.[] | select(.isPrerelease and (.isDraft | not))][0].tagName // empty')
          fi
          if [ -z "$tag" ]; then
            echo "no dev pre-release tag found on LenderCom/saw-agent-releases (and none given)" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # The schedule fires every 15 min but dev builds land every couple of hours, so most
          # polls are no-ops — short-circuit those before paying for a Homebrew install.
          if grep -q "/download/${tag}/" Formula/saw-agent-dev.rb; then
            echo "already-pinned=true" >> "$GITHUB_OUTPUT"
          else
            echo "already-pinned=false" >> "$GITHUB_OUTPUT"
          fi

      # ubuntu-latest dropped Homebrew in the 24.04 move, so `brew style` below exits 127
      # without this — the failure that stalled every scheduled bump.
      #
      # Must run BEFORE the bump: this action relinks a tap checkout against origin, which
      # silently discards an uncommitted edit in the workspace. Running it after produced a
      # bump step that logged "Bumped ... to dev-v0.1.2-dev.97" followed by a commit step that
      # saw "nothing to commit, working tree clean" — see run 30264270641. The `if:` keeps a
      # no-op poll from paying for the install.
      - name: Set up Homebrew
        if: steps.tag.outputs.already-pinned == 'false'
        uses: Homebrew/actions/setup-homebrew@master

      - name: Bump formula from the published manifest
        if: steps.tag.outputs.already-pinned == 'false'
        run: |
          manifest_url="https://github.com/LenderCom/saw-agent-releases/releases/download/${{ steps.tag.outputs.tag }}/manifest.json"
          ruby script/bump-formula.rb "$manifest_url" "${{ steps.tag.outputs.tag }}" Formula/saw-agent-dev.rb

      - name: Verify
        if: steps.tag.outputs.already-pinned == 'false'
        run: |
          ruby -c Formula/saw-agent-dev.rb
          brew style Formula/saw-agent-dev.rb

      # Pushes to an explicitly authenticated URL rather than `origin`: setup-homebrew relinks
      # the tap checkout, which drops the credentials actions/checkout persisted into the local
      # git config, so `git push origin` fails with "could not read Username for
      # https://github.com" (run 30264704205). GH_TOKEN is masked in logs.
      - name: Commit to main
        if: steps.tag.outputs.already-pinned == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump saw-agent-dev to ${{ steps.tag.outputs.tag }}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      # Nothing watches a scheduled job in a quiet repo — this one failed ~100 times over four
      # days unnoticed, and users only found out when the pinned release was pruned out from
      # under them. Surface it at the moment it breaks, not one prune cycle later.
      - uses: ./.github/actions/report-breakage
        if: failure() && github.event_name == 'schedule'
        with:
          token: ${{ github.token }}
          title: "saw-agent-dev formula bump is failing"
          body: |
            The scheduled `saw-agent-dev` formula bump is failing, so the tap is frozen on
            whatever dev prerelease it last pinned. `saw-agent`'s `release-dev.yml` prunes
            `saw-agent-releases` to the newest 5 prereleases, so once that pin ages out
            `brew install lendercom/tap/saw-agent-dev` starts 404ing on the download.
